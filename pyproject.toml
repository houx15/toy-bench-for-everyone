[project]
name = "scorer-kit"
version = "0.1.0"
description = "Turn your own AI usage into a private benchmark and find out which model should do which job for you."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
scorer = "scorer_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scorer_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
